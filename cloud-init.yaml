#cloud-config
package_update: true

packages:
  - apache2

write_files:
  - path: /var/www/html/index.html
    owner: root:root
    permissions: "0644"
    content: |
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8">
          <title>Terraform web server</title>
        </head>
        <body>
          <h1>Hello from Terraform!</h1>
        </body>
      </html>

runcmd:
  - [systemctl, enable, --now, apache2]
